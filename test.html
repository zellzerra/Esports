<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transparent Off-White Box</title>
    <style>
        body {
            background-image: url("Image Folder/ZANDERS TEMP WEB PIC.jpg"); /* Background image for demo */
            background-size: cover; /* Ensure background image covers entire screen */
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .transparent-box {
            background-color: rgba(255, 255, 255, 0.7); /* Off-white with 70% transparency */
            color: black; /* Text color */
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2); /* Optional shadow */
        }
    </style>
</head>
<body>
    <div class="transparent-box">
        This is some text in an off-white transparent box!
    </div>
</body>
</html>
